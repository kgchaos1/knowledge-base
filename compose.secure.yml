# Independent production definition; explicitly use -f compose.secure.yml.
# Existing local image supplies dependencies, source is mounted read-only.
services:
  pkm-api:
    image: pkm-before-anthropic:local
    container_name: pkm-api
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--no-proxy-headers"]
    env_file: .env
    environment:
      DEBUG: "false"
      DATABASE_URL: sqlite:////app/data/pkm.db
      PKM_PUBLIC_ORIGIN: https://kgchaos1.eu.cc
      PKM_TRUSTED_PROXY_PEERS: 172.29.91.3
    volumes:
      - ./backend/app:/app/app:ro
      - ./data:/app/data
      - ./backups:/app/backups
    networks:
      private:
        ipv4_address: 172.29.91.2
  pkm-web:
    image: nginx:alpine
    container_name: pkm-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx-secure.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certificates:/etc/pkm-certificates:ro
      - ./acme:/var/www/acme:ro
    networks:
      private:
        ipv4_address: 172.29.91.3
    depends_on:
      - pkm-api
networks:
  private:
    ipam:
      config:
        - subnet: 172.29.91.0/24
