services:
  pkm-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pkm-api
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    environment:
      - DATABASE_URL=sqlite:///./data/pkm.db
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      - ANTHROPIC_AUTH_TOKEN=${ANTHROPIC_AUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOCAL_MODEL_URL=${LOCAL_MODEL_URL:-http://host.docker.internal:11434}
      - YUQUE_TOKEN=${YUQUE_TOKEN:-}
      - ZHIHU_COOKIE=${ZHIHU_COOKIE:-}
      - DOUYIN_COOKIE=${DOUYIN_COOKIE:-}
    networks:
      - pkm-network

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: pkm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - pkm-api
    networks:
      - pkm-network
    profiles:
      - production

networks:
  pkm-network:
    driver: bridge

volumes:
  data:
  backups:
